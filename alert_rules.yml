groups:
  - name: todo_app_alerts
    rules:
      # Alert if error rate > 5% over last 5 minutes
      - alert: HighErrorRate
        expr: |
          sum(rate(todo_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(todo_http_requests_total[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # Alert if P95 latency > 1 second
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(todo_http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.route }}"
          description: "P95 latency is {{ $value }}s on route {{ $labels.route }}."

      # Alert if app is completely down
      - alert: AppDown
        expr: up{job="todo_backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "To-do app is down"
          description: "The backend has been unreachable for 30 seconds."
